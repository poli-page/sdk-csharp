version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-deps:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "WireMock.Net"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
      analyzers:
        patterns:
          - "Microsoft.CodeAnalysis.*"
          - "Meziantou.Analyzer"
          - "Roslynator.*"
    ignore:
      # FluentAssertions 8.x is commercial (Xceed); we stay on the last MIT-licensed line.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    # Daily, so a new API contract version arrives as a PR the next day.
    schedule:
      interval: daily
      time: "07:00"
      timezone: "Europe/Paris"
    # Dependabot waits 3 days after a release by default; exempt the contract.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    open-pull-requests-limit: 3
    groups:
      # init and analyze are two halves of the same action: bumping them in
      # separate PRs makes analyze reject the config init wrote.
      codeql:
        patterns:
          - "github/codeql-action*"
      # The API contract alone: its PR's CI shows what the API change breaks.
      api-contract:
        patterns:
          - "poli-page/api-contract"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
